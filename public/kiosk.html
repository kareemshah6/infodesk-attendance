<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-in Kiosk</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #1e3a8a; --fg: #fff; --card: #fff; --accent: #f59e0b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
    h1 { margin: 0 0 4px; font-size: clamp(1.4rem, 4vw, 2.4rem); }
    .clock { font-size: clamp(1rem, 2.5vw, 1.4rem); opacity: .85; margin-bottom: 20px; font-variant-numeric: tabular-nums; }
    .qr { background: var(--card); border-radius: 24px; padding: 16px; width: min(70vh, 90vw, 560px); aspect-ratio: 1; }
    .qr img { width: 100%; height: 100%; display: block; }
    .code { font-size: clamp(2rem, 6vw, 3.6rem); font-weight: 800; letter-spacing: .25em; margin: 18px 0 4px; font-variant-numeric: tabular-nums; padding-left: .25em; }
    .bar { width: min(70vh, 90vw, 560px); height: 8px; border-radius: 99px; background: rgba(255,255,255,.2); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); transition: width 1s linear; }
    p { opacity: .85; margin: 14px 0 0; }
    .err { background: #b91c1c; padding: 16px 20px; border-radius: 14px; max-width: 480px; }
  </style>
</head>
<body>
  <h1 id="name">Check-in</h1>
  <div class="clock" id="clock"></div>
  <div class="qr"><img id="img" alt="Check-in QR code"></div>
  <div class="code" id="code">······</div>
  <div class="bar"><i id="bar"></i></div>
  <p>Scan with the Infodesk app or your phone camera to check in / check out.</p>
  <script>
    const key = new URLSearchParams(location.search).get('key') || '';
    let left = 60, timer;
    const $ = (id) => document.getElementById(id);
    async function load() {
      try {
        const res = await fetch('/api/kiosk/qr?key=' + encodeURIComponent(key));
        const d = await res.json();
        if (!res.ok) throw new Error(d.error || 'Error');
        $('name').textContent = d.institute;
        $('img').src = d.image;
        $('code').textContent = d.code;
        left = d.secondsLeft;
        clearTimeout(timer);
        timer = setTimeout(load, left * 1000 + 300);
      } catch (e) {
        document.body.innerHTML = '<div class="err">' + String(e.message).replace(/[<>&]/g, '') + '</div>';
        if (e.message !== 'Error' && !/no longer valid/.test(e.message)) setTimeout(() => location.reload(), 15000);
      }
    }
    setInterval(() => {
      left = Math.max(0, left - 1);
      $('bar') && ($('bar').style.width = (left / 60 * 100) + '%');
      $('clock') && ($('clock').textContent = new Date().toLocaleString(undefined, { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' }));
    }, 1000);
    load();
  </script>
</body>
</html>
